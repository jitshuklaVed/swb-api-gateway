server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/xml
    min-response-size: 1024

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
        pool:
          type: ELASTIC
          max-connections: 2000
          max-idle-time: 20000
          acquire-timeout: 5000
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**,/api/media/**,/api/users/me/avatar

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/v3/api-docs/**
          filters:
            - RewritePath=/user-service/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/api/posts/**,/api/reels/**

        - id: post-service-docs
          uri: lb://POST-SERVICE
          predicates:
            - Path=/post-service/v3/api-docs/**
          filters:
            - RewritePath=/post-service/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: friend-service
          uri: lb://FRIEND-SERVICE
          predicates:
            - Path=/api/friends/**

        - id: friend-service-docs
          uri: lb://FRIEND-SERVICE
          predicates:
            - Path=/friend-service/v3/api-docs/**
          filters:
            - RewritePath=/friend-service/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: page-service
          uri: lb://PAGE-SERVICE
          predicates:
            - Path=/api/pages/**

        - id: page-service-docs
          uri: lb://PAGE-SERVICE
          predicates:
            - Path=/page-service/v3/api-docs/**
          filters:
            - RewritePath=/page-service/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: auth-service-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/v3/api-docs/**
          filters:
            - RewritePath=/auth-service/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: auth-service-jwks
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/.well-known/jwks.json,/api/auth/.well-known/jwks.json,/api/auth/public-key

        - id: neon-auth
          uri: ${NEON_AUTH_URL:https://ep-odd-wildflower-b41gmcrb.neonauth.c-6.us-east-2.aws.neon.tech}
          predicates:
            - Path=/neon-auth/**
          filters:
            - RewritePath=/neon-auth/(?<segment>.*), /Authentication_db/auth/${segment}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /auth-service/v3/api-docs
    urls:
      - name: Auth & Media Service
        url: /auth-service/v3/api-docs
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Post Service
        url: /post-service/v3/api-docs
      - name: Friend & Engagement Service
        url: /friend-service/v3/api-docs
      - name: Page Management Service
        url: /page-service/v3/api-docs
      - name: API Gateway
        url: /v3/api-docs
    urls-primary-name: Auth & Media Service
  api-docs:
    enabled: true
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-32-bytes}
    rsa:
      jwks-uri: ${AUTH_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      public-key: ${JWT_RSA_PUBLIC_KEY:}
    neon-auth:
      jwks-uri: ${NEON_AUTH_JWKS_URI:https://ep-odd-wildflower-b41gmcrb.neonauth.c-6.us-east-2.aws.neon.tech/Authentication_db/auth/.well-known/jwks.json}
  cors:
    allowed-origins:
      - "*"
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:5500"
      - "http://localhost:8080"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:5173"
      - "http://127.0.0.1:5500"
      - "http://127.0.0.1:8080"
      - "null"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  rate-limiter:
    enabled: true
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:300}
    general-requests-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:5000}
  public-endpoints:
    - "/api/auth/login"
    - "/api/auth/register"
    - "/api/auth/validate"
    - "/api/media/view/**"
    - "/api/media/s3-url"
    - "/api/media/presigned"
    - "/neon-auth/**"
    - "/actuator/health"
    - "/actuator/info"
    - "/v3/api-docs/**"
    - "/swagger-ui/**"
    - "/swagger-ui.html"
    - "/webjars/**"
    - "/auth-service/v3/api-docs/**"
    - "/user-service/v3/api-docs/**"
    - "/post-service/v3/api-docs/**"
    - "/friend-service/v3/api-docs/**"
    - "/api/users/username/**"
    - "/api/users/search"
    - "/.well-known/jwks.json"
    - "/api/auth/.well-known/jwks.json"
    - "/api/auth/public-key"
